name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile validator
        run: python -m py_compile scripts/validate_timegen_xml.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate bundled XML files
        run: |
          python scripts/validate_timegen_xml.py templates/minimal.xml
          python scripts/validate_timegen_xml.py examples/example.xml
